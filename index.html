<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- ── Page Header ───────────────────────────────────────── -->
  <header class="page-header">
    <h1 class="page-title">Expense &amp; Budget Visualizer</h1>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">
      <span class="theme-icon">🌙</span>
    </button>
  </header>

  <main class="page-main">

    <!-- ── Total Balance ─────────────────────────────────── -->
    <section class="balance-card" aria-label="Total balance">
      <p class="balance-label">TOTAL BALANCE</p>
      <h2 class="balance-amount" id="totalBalance">Rp 0</h2>
      <p class="balance-sub" id="transactionCount">0 transactions</p>
    </section>

    <!-- ── Monthly Summary ───────────────────────────────── -->
    <section class="card monthly-card" aria-label="Monthly summary">
      <div class="card-header">
        <h3 class="card-title">Monthly Summary</h3>
        <div class="month-nav">
          <button class="nav-btn" id="prevMonth" aria-label="Previous month">&#8249;</button>
          <span class="month-label" id="currentMonthLabel"></span>
          <button class="nav-btn" id="nextMonth" aria-label="Next month">&#8250;</button>
        </div>
      </div>
      <div class="monthly-stats" id="monthlyStats"></div>
    </section>

    <!-- ── Add Transaction Form ───────────────────────────── -->
    <section class="card form-card" aria-label="Add transaction">
      <h3 class="card-title">Add Transaction</h3>

      <form class="transaction-form" id="transactionForm" novalidate>

        <div class="form-group">
          <label for="itemName" class="form-label">Item Name</label>
          <input type="text" id="itemName" class="form-input"
            placeholder="e.g. Lunch, Grab, Netflix"
            maxlength="60" autocomplete="off" />
          <span class="field-error" id="nameError"></span>
        </div>

        <div class="form-group">
          <label for="amount" class="form-label">Amount (Rp)</label>
          <input type="number" id="amount" class="form-input"
            placeholder="e.g. 25000" min="1" step="any" />
          <span class="field-error" id="amountError"></span>
        </div>

        <div class="form-group">
          <label for="category" class="form-label">Category</label>
          <select id="category" class="form-input form-select">
            <option value="">Select category…</option>
            <option value="Food">🍔 Food</option>
            <option value="Transport">🚗 Transport</option>
            <option value="Fun">🎮 Fun</option>
          </select>
          <span class="field-error" id="categoryError"></span>
        </div>

        <!-- Custom category toggle -->
        <div class="custom-category-row">
          <button type="button" class="btn-link" id="toggleCustomCategory">
            + Add custom category
          </button>
        </div>
        <div class="form-group custom-category-group hidden" id="customCategoryGroup">
          <label for="customCategory" class="form-label">New Category Name</label>
          <div class="custom-cat-input-row">
            <input type="text" id="customCategory" class="form-input"
              placeholder="e.g. Health, Shopping" maxlength="30" />
            <button type="button" class="btn-secondary" id="addCustomCategory">Add</button>
          </div>
          <span class="field-error" id="customCategoryError"></span>
        </div>

        <div class="form-group">
          <label for="transactionDate" class="form-label">Date</label>
          <input type="date" id="transactionDate" class="form-input" />
        </div>

        <button type="submit" class="btn-primary">Add Transaction</button>
      </form>
    </section>

    <!-- ── Bottom Row: Transactions + Chart ──────────────── -->
    <div class="bottom-row">

      <!-- Transactions List -->
      <section class="card list-card" aria-label="Transaction history">
        <div class="card-header">
          <h3 class="card-title">Transactions</h3>
          <div class="list-controls">
            <select class="filter-select" id="filterCategory" aria-label="Filter by category">
              <option value="all">All</option>
            </select>
            <button class="btn-clear" id="clearAll">Clear All</button>
          </div>
        </div>

        <div class="transaction-list" id="transactionList" role="list"></div>
        <p class="list-empty" id="listEmpty">No transactions yet.</p>
      </section>

      <!-- Chart -->
      <section class="card chart-card" aria-label="Spending chart">
        <h3 class="card-title">Spending by Category</h3>
        <div class="chart-wrapper">
          <canvas id="spendingChart" aria-label="Pie chart of spending by category"></canvas>
          <p class="chart-empty" id="chartEmpty">Add transactions to see the chart</p>
        </div>
        <div class="chart-legend" id="chartLegend"></div>
      </section>

    </div><!-- /bottom-row -->

  </main>

  <footer class="page-footer">
    <p>Built with ☁️ BudgetViz</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
